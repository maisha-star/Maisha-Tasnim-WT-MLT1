        <h4>Class Feedback Form</h4>
        <form action="form-handler.html" method="post">
            <fieldset>
				<legend>Class Feedback</legend>
                <label for="fullname">Full Name:</label>
                <input id="fullname" name="fn" minlength="3" required />
                <br /><br>
                <label for="email">Email:</label>
                <input type="email" id="email" name="em" required />
            
            <br /><br>
            <label for="class date">Class Date:</label>
            <input type="class date" id="class date" name="cd" required />
            <br /><br>
            <label for="course">Course:</label>
            <input type="course" id="course" name="p1" required />
            <br /><br>
            <label for="rating (1 to 5)">Rating (1 to 5):</label>
            <input type="rating (1 to 5)" id="rating (1 to 5)" name="p2" required />
            <br />
            <button>Comment</button>
            <br /><br>
            <textarea name="" id=""></textarea>
            <br />
            Class Type:
            <br />
            <input type="radio" name="class type" /> Lab
            <br />
            <input type="radio" name="class type" /> Theory
            <br />
           
            <select>
                <option value="">Select an option</option>
                <option value="l">Lab</option>
                <option value="th">Theory</option>
            </select>
            <br />
            <br />
            <button>send feedback</button>
        </form>
